<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Command lifecycle"><title>Command lifecycle</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e0e0e"/></marker></defs><rect x="0" y="0" width="1200" height="720" rx="16" fill="#f4f4f2" stroke="none" stroke-width="1.5"/><text x="40" y="52" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#0e0e0e" text-anchor="start">Command lifecycle</text><text x="40" y="78" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#555" text-anchor="start">A command is only VERIFIED when the vehicle's own telemetry proves it was executed.</text><text x="40" y="132" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#555" text-anchor="start">CONSOLE SHOWS</text><rect x="245" y="108" width="170" height="40" rx="8" fill="#fff" stroke="#0e0e0e" stroke-width="2"/><text x="330" y="134" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#0e0e0e" text-anchor="middle">Console</text><line x1="330" y1="148" x2="330" y2="610" stroke="#c9c9c9" stroke-width="2" stroke-dasharray="6 5"/><rect x="435" y="108" width="170" height="40" rx="8" fill="#fff" stroke="#0e0e0e" stroke-width="2"/><text x="520" y="134" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#0e0e0e" text-anchor="middle">API</text><line x1="520" y1="148" x2="520" y2="610" stroke="#c9c9c9" stroke-width="2" stroke-dasharray="6 5"/><rect x="625" y="108" width="170" height="40" rx="8" fill="#fff" stroke="#0e0e0e" stroke-width="2"/><text x="710" y="134" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#0e0e0e" text-anchor="middle">Redis</text><line x1="710" y1="148" x2="710" y2="610" stroke="#c9c9c9" stroke-width="2" stroke-dasharray="6 5"/><rect x="815" y="108" width="170" height="40" rx="8" fill="#fff" stroke="#0e0e0e" stroke-width="2"/><text x="900" y="134" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#0e0e0e" text-anchor="middle">Simulator</text><line x1="900" y1="148" x2="900" y2="610" stroke="#c9c9c9" stroke-width="2" stroke-dasharray="6 5"/><rect x="1005" y="108" width="170" height="40" rx="8" fill="#fff" stroke="#0e0e0e" stroke-width="2"/><text x="1090" y="134" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#0e0e0e" text-anchor="middle">Ingest worker</text><line x1="1090" y1="148" x2="1090" y2="610" stroke="#c9c9c9" stroke-width="2" stroke-dasharray="6 5"/><line x1="336" y1="200" x2="514" y2="200" stroke="#0e0e0e" stroke-width="2" marker-end="url(#head)"/><text x="425.0" y="191" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#0e0e0e" text-anchor="middle">POST /api/commands</text><line x1="526" y1="250" x2="704" y2="250" stroke="#0e0e0e" stroke-width="2" marker-end="url(#head)"/><text x="615.0" y="241" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#0e0e0e" text-anchor="middle">XADD tc:queue</text><line x1="716" y1="320" x2="894" y2="320" stroke="#0e0e0e" stroke-width="2" marker-end="url(#head)"/><text x="805.0" y="311" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#0e0e0e" text-anchor="middle">XREAD (next tick)</text><line x1="894" y1="370" x2="716" y2="370" stroke="#0e0e0e" stroke-width="2" marker-end="url(#head)"/><text x="805.0" y="361" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#0e0e0e" text-anchor="middle">status = received</text><line x1="894" y1="440" x2="716" y2="440" stroke="#0e0e0e" stroke-width="2" marker-end="url(#head)"/><text x="805.0" y="431" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#0e0e0e" text-anchor="middle">frame: last_cmd = id</text><line x1="716" y1="490" x2="1084" y2="490" stroke="#0e0e0e" stroke-width="2" marker-end="url(#head)"/><text x="900.0" y="481" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#0e0e0e" text-anchor="middle">XREADGROUP tm:raw</text><line x1="1084" y1="560" x2="716" y2="560" stroke="#0e0e0e" stroke-width="2" marker-end="url(#head)"/><text x="900.0" y="551" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#0e0e0e" text-anchor="middle">status = verified</text><rect x="40" y="210" width="56" height="26" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1.5"/><text x="68.0" y="228" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#555" text-anchor="middle">SENT</text><rect x="40" y="355" width="88" height="26" rx="4" fill="#fff" stroke="#c9c9c9" stroke-width="1.5"/><text x="84.0" y="373" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#555" text-anchor="middle">RECEIVED</text><rect x="40" y="545" width="88" height="26" rx="4" fill="#dff3e4" stroke="#dff3e4" stroke-width="1.5"/><text x="84.0" y="563" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#1a7f37" text-anchor="middle">VERIFIED</text><text x="40" y="250" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#555" text-anchor="start">API wrote it to</text><text x="40" y="271" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#555" text-anchor="start">the queue</text><text x="40" y="395" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#555" text-anchor="start">the vehicle</text><text x="40" y="416" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#555" text-anchor="start">took it</text><text x="40" y="585" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#555" text-anchor="start">seen in</text><text x="40" y="606" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#555" text-anchor="start">telemetry</text><rect x="40" y="630" width="1120" height="66" rx="8" fill="#fff1f0" stroke="#d92d20" stroke-width="1.5"/><rect x="56" y="648" width="72" height="26" rx="4" fill="#d92d20" stroke="#d92d20" stroke-width="1.5"/><text x="92.0" y="666" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">FAILED</text><text x="160" y="658" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#0e0e0e" text-anchor="start">still SENT after 5 s → the vehicle never got it.</text><text x="160" y="680" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#0e0e0e" text-anchor="start">still RECEIVED after 15 s → it got it, but telemetry never confirmed it (for example during a dropout).</text></svg>
