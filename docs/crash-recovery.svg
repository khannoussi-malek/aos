<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-label="Crash recovery: XACK after processing"><title>Crash recovery: XACK after processing</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e0e0e"/></marker></defs><rect x="0" y="0" width="1200" height="740" rx="16" fill="#f4f4f2" stroke="none" stroke-width="1.5"/><text x="40" y="52" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#0e0e0e" text-anchor="start">Crash recovery: XACK after processing</text><text x="40" y="78" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#555" text-anchor="start">Redis remembers which frames the worker took but did not finish, so a crash loses nothing.</text><rect x="20" y="106" width="1160" height="160" rx="12" fill="#fff" stroke="#c9c9c9" stroke-width="1.5"/><text x="44" y="142" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#0e0e0e" text-anchor="start">1 · Normal</text><rect x="44" y="163" width="136" height="26" rx="4" fill="#dff3e4" stroke="#dff3e4" stroke-width="1.5"/><text x="112.0" y="181" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#1a7f37" text-anchor="middle">WORKER RUNNING</text><text x="270" y="134" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#555" text-anchor="start">stream tm:raw</text><rect x="270" y="148" width="62" height="46" rx="6" fill="#e4e4e4" stroke="#c9c9c9" stroke-width="2"/><text x="301" y="177" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#555" text-anchor="middle">101</text><rect x="342" y="148" width="62" height="46" rx="6" fill="#e4e4e4" stroke="#c9c9c9" stroke-width="2"/><text x="373" y="177" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#555" text-anchor="middle">102</text><rect x="414" y="148" width="62" height="46" rx="6" fill="#e4e4e4" stroke="#c9c9c9" stroke-width="2"/><text x="445" y="177" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#555" text-anchor="middle">103</text><rect x="486" y="148" width="62" height="46" rx="6" fill="#f4d828" stroke="#f4d828" stroke-width="2"/><text x="517" y="177" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#0e0e0e" text-anchor="middle">104</text><rect x="558" y="148" width="62" height="46" rx="6" fill="none" stroke="#c9c9c9" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="630" y="148" width="62" height="46" rx="6" fill="none" stroke="#c9c9c9" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="702" y="148" width="62" height="46" rx="6" fill="none" stroke="#c9c9c9" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="774" y="148" width="62" height="46" rx="6" fill="none" stroke="#c9c9c9" stroke-width="1.5" stroke-dasharray="4 4"/><text x="517" y="224" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#0e0e0e" text-anchor="middle">processing</text><text x="870" y="150" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#0e0e0e" text-anchor="start">The worker reads frame 104.</text><text x="870" y="174" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#0e0e0e" text-anchor="start">Redis marks it PENDING.</text><text x="870" y="198" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#0e0e0e" text-anchor="start">Stored → XACK → removed from pending.</text><rect x="20" y="281" width="1160" height="160" rx="12" fill="#fff" stroke="#c9c9c9" stroke-width="1.5"/><text x="44" y="317" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#0e0e0e" text-anchor="start">2 · Crash</text><rect x="44" y="338" width="136" height="26" rx="4" fill="#d92d20" stroke="#d92d20" stroke-width="1.5"/><text x="112.0" y="356" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">WORKER CRASHED</text><text x="270" y="309" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#555" text-anchor="start">stream tm:raw</text><rect x="270" y="323" width="62" height="46" rx="6" fill="#e4e4e4" stroke="#c9c9c9" stroke-width="2"/><text x="301" y="352" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#555" text-anchor="middle">101</text><rect x="342" y="323" width="62" height="46" rx="6" fill="#e4e4e4" stroke="#c9c9c9" stroke-width="2"/><text x="373" y="352" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#555" text-anchor="middle">102</text><rect x="414" y="323" width="62" height="46" rx="6" fill="#e4e4e4" stroke="#c9c9c9" stroke-width="2"/><text x="445" y="352" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#555" text-anchor="middle">103</text><rect x="486" y="323" width="62" height="46" rx="6" fill="#f4d828" stroke="#f4d828" stroke-width="2"/><text x="517" y="352" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#0e0e0e" text-anchor="middle">104</text><text x="517" y="399" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#d92d20" text-anchor="middle">✕ no XACK</text><rect x="558" y="323" width="62" height="46" rx="6" fill="#fff" stroke="#0e0e0e" stroke-width="2"/><text x="589" y="352" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#0e0e0e" text-anchor="middle">105</text><rect x="630" y="323" width="62" height="46" rx="6" fill="#fff" stroke="#0e0e0e" stroke-width="2"/><text x="661" y="352" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#0e0e0e" text-anchor="middle">106</text><rect x="702" y="323" width="62" height="46" rx="6" fill="#fff" stroke="#0e0e0e" stroke-width="2"/><text x="733" y="352" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#0e0e0e" text-anchor="middle">107</text><rect x="774" y="323" width="62" height="46" rx="6" fill="#fff" stroke="#0e0e0e" stroke-width="2"/><text x="805" y="352" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#0e0e0e" text-anchor="middle">108</text><text x="870" y="325" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#0e0e0e" text-anchor="start">Crash before XACK: 104 stays PENDING.</text><text x="870" y="349" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#0e0e0e" text-anchor="start">The simulator keeps writing;</text><text x="870" y="373" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#0e0e0e" text-anchor="start">new frames wait in the stream.</text><rect x="20" y="456" width="1160" height="160" rx="12" fill="#fff" stroke="#c9c9c9" stroke-width="1.5"/><text x="44" y="492" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#0e0e0e" text-anchor="start">3 · Restart</text><rect x="44" y="513" width="152" height="26" rx="4" fill="#dff3e4" stroke="#dff3e4" stroke-width="1.5"/><text x="120.0" y="531" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#1a7f37" text-anchor="middle">WORKER RESTARTED</text><text x="270" y="484" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#555" text-anchor="start">stream tm:raw</text><rect x="270" y="498" width="62" height="46" rx="6" fill="#e4e4e4" stroke="#c9c9c9" stroke-width="2"/><text x="301" y="527" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#555" text-anchor="middle">101</text><rect x="342" y="498" width="62" height="46" rx="6" fill="#e4e4e4" stroke="#c9c9c9" stroke-width="2"/><text x="373" y="527" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#555" text-anchor="middle">102</text><rect x="414" y="498" width="62" height="46" rx="6" fill="#e4e4e4" stroke="#c9c9c9" stroke-width="2"/><text x="445" y="527" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#555" text-anchor="middle">103</text><rect x="486" y="498" width="62" height="46" rx="6" fill="#f4d828" stroke="#f4d828" stroke-width="2"/><text x="517" y="527" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#0e0e0e" text-anchor="middle">104</text><rect x="558" y="498" width="62" height="46" rx="6" fill="#fff" stroke="#0e0e0e" stroke-width="2"/><text x="589" y="527" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#0e0e0e" text-anchor="middle">105</text><rect x="630" y="498" width="62" height="46" rx="6" fill="#fff" stroke="#0e0e0e" stroke-width="2"/><text x="661" y="527" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#0e0e0e" text-anchor="middle">106</text><rect x="702" y="498" width="62" height="46" rx="6" fill="#fff" stroke="#0e0e0e" stroke-width="2"/><text x="733" y="527" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#0e0e0e" text-anchor="middle">107</text><rect x="774" y="498" width="62" height="46" rx="6" fill="#fff" stroke="#0e0e0e" stroke-width="2"/><text x="805" y="527" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#0e0e0e" text-anchor="middle">108</text><text x="517" y="574" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0e0e0e" text-anchor="middle">①</text><line x1="558" y1="568" x2="836" y2="568" stroke="#0e0e0e" stroke-width="2" marker-end="url(#head)"/><text x="702" y="590" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0e0e0e" text-anchor="middle">②</text><text x="870" y="500" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#0e0e0e" text-anchor="start">① re-read own pending (cursor 0)</text><text x="870" y="524" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#0e0e0e" text-anchor="start">② then new frames (cursor >)</text><text x="870" y="548" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#0e0e0e" text-anchor="start">No frame lost.</text><text x="44" y="650" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#0e0e0e" text-anchor="start">Why 104 is never counted twice:</text><text x="44" y="674" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#0e0e0e" text-anchor="start">each frame is written in one MULTI/EXEC transaction, including last_seq. So 104 was stored completely or not at all.</text><text x="44" y="695" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#0e0e0e" text-anchor="start">If it was stored, seq 104 ≤ last_seq → skipped as a duplicate. If not, it is processed now. Either way: exactly one copy.</text><rect x="800" y="40" width="20" height="20" rx="4" fill="#e4e4e4" stroke="#c9c9c9" stroke-width="2"/><text x="828" y="55" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#0e0e0e" text-anchor="start">acked</text><rect x="930" y="40" width="20" height="20" rx="4" fill="#f4d828" stroke="#f4d828" stroke-width="2"/><text x="958" y="55" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#0e0e0e" text-anchor="start">pending</text><rect x="1060" y="40" width="20" height="20" rx="4" fill="#fff" stroke="#0e0e0e" stroke-width="2"/><text x="1088" y="55" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#0e0e0e" text-anchor="start">not read</text></svg>
