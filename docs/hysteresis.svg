<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Alarms with hysteresis"><title>Alarms with hysteresis</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e0e0e"/></marker></defs><rect x="0" y="0" width="1200" height="600" rx="16" fill="#f4f4f2" stroke="none" stroke-width="1.5"/><text x="40" y="52" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#0e0e0e" text-anchor="start">Alarms with hysteresis</text><text x="40" y="78" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#555" text-anchor="start">An alarm is raised when the value crosses the limit, but it only clears 0.21 kPa (3% of the band) back inside.</text><rect x="120" y="366.1538461538467" width="880" height="73.8461538461533" rx="0" fill="#fdf6c3" stroke="none" stroke-width="1.5"/><rect x="120" y="314.4615384615404" width="880" height="51.692307692306315" rx="0" fill="#ececec" stroke="none" stroke-width="1.5"/><text x="130" y="428" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#6b5a00" text-anchor="start">CAUTION zone (below 97.0)</text><line x1="120" y1="366.1538461538467" x2="1000" y2="366.1538461538467" stroke="#b59b00" stroke-width="2" stroke-dasharray="8 5"/><line x1="120" y1="314.4615384615404" x2="1000" y2="314.4615384615404" stroke="#555" stroke-width="1.5" stroke-dasharray="3 4"/><text x="1012" y="371.1538461538467" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#8a7500" text-anchor="start">limit 97.0</text><text x="1012" y="312.4615384615404" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#555" text-anchor="start">clear 97.21</text><line x1="120" y1="120" x2="120" y2="440" stroke="#c9c9c9" stroke-width="1.5"/><line x1="120" y1="440" x2="1000" y2="440" stroke="#c9c9c9" stroke-width="1.5"/><text x="110" y="371.1538461538467" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#555" text-anchor="end">97.0</text><text x="110" y="248.07692307692335" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#555" text-anchor="end">97.5</text><text x="110" y="125.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#555" text-anchor="end">98.0</text><text x="110" y="106" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#555" text-anchor="end">kPa</text><text x="1000" y="466" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#555" text-anchor="end">time →</text><polyline points="120.0,144.6 155.2,169.2 190.4,206.2 225.6,243.1 260.8,280.0 296.0,316.9 331.2,346.5 366.4,378.5 401.6,395.7 436.8,373.5 472.0,351.4 507.2,376.0 542.4,341.5 577.6,358.8 612.8,385.8 648.0,336.6 683.2,353.8 718.4,371.1 753.6,331.7 788.8,346.5 824.0,321.8 859.2,292.3 894.4,255.4 929.6,230.8 964.8,218.5 1000.0,213.5" fill="none" stroke="#0e0e0e" stroke-width="2.5" stroke-linejoin="round"/><circle cx="366.4" cy="378.5" r="7" fill="#f4d828" stroke="#0e0e0e" stroke-width="2"/><text x="366.4" y="412.46153846153834" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0e0e0e" text-anchor="middle">① CAUTION raised</text><circle cx="859.2" cy="292.3" r="7" fill="#fff" stroke="#0e0e0e" stroke-width="2"/><text x="873.2" y="338.3076923076934" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0e0e0e" text-anchor="start">② back to nominal</text><text x="612.8" y="255.38461538461496" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#0e0e0e" text-anchor="middle">noise crosses 97.0 again and again,</text><text x="612.8" y="275.38461538461496" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#0e0e0e" text-anchor="middle">but never reaches 97.21: no new alarm</text><rect x="120" y="490" width="420" height="80" rx="8" fill="#dff3e4" stroke="#1a7f37" stroke-width="1.5"/><text x="140" y="522" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#1a7f37" text-anchor="start">With hysteresis: 2 events</text><text x="140" y="548" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#0e0e0e" text-anchor="start">one alarm, one 'back to nominal'</text><rect x="580" y="490" width="420" height="80" rx="8" fill="#fff1f0" stroke="#d92d20" stroke-width="1.5"/><text x="600" y="522" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#d92d20" text-anchor="start">Without: 8 events</text><text x="600" y="548" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#0e0e0e" text-anchor="start">the alarm flaps on and off: operators stop trusting it</text></svg>
