[project]
name = "aos"
version = "0.1.0"
description = "Mini mission-control console: simulated telemetry, Redis Streams ingest, limit checking, live API."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "redis>=5.2",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
