# Yellow = caution, red = action needed. A value outside [lo, hi] is in that band.
# Ranges are checked red first, then yellow. `label` is the human name shown to operators.
battery_v:       {label: Battery voltage,     unit: V,     yellow: [26.0, 30.5],  red: [24.5, 31.5]}
cabin_kpa:       {label: Cabin pressure,      unit: kPa,   yellow: [97.0, 104.0], red: [94.0, 106.0]}
temp_cabin_c:    {label: Cabin temperature,   unit: degC,  yellow: [16.0, 28.0],  red: [10.0, 32.0]}
temp_avionics_c: {label: Avionics temperature, unit: degC, yellow: [5.0, 45.0],   red: [0.0, 55.0]}
temp_battery_c:  {label: Battery temperature, unit: degC,  yellow: [10.0, 35.0],  red: [5.0, 42.0]}
rate_x_dps:      {label: Roll rate (X),       unit: deg/s, yellow: [-2.0, 2.0],   red: [-5.0, 5.0]}
rate_y_dps:      {label: Pitch rate (Y),      unit: deg/s, yellow: [-2.0, 2.0],   red: [-5.0, 5.0]}
rate_z_dps:      {label: Yaw rate (Z),        unit: deg/s, yellow: [-2.0, 2.0],   red: [-5.0, 5.0]}
